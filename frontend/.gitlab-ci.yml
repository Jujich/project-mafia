# Deploys the frontend directly on the GitLab runner that executes this pipeline.
# Expectations for the runner (shell or docker executor with docker access):
#   - docker + docker compose v2 available
#   - the runner runs on the deployment host
#
# Override defaults with CI/CD variables if needed:
#   NUXT_BACKEND_API_URL (default http://mafia-backend:3000), FRONTEND_PORT.

stages:
  - deploy

deploy:
  stage: deploy
  # tags: [mafia]            # uncomment and set to target a specific runner
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - docker network create mafia-net || true
    - docker compose up -d --build
    - docker image prune -f || true
  environment:
    name: production
